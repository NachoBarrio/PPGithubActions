name: Deploy Power Platform solution to production

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: Unique name of the solution
        required: true
      solution_folder:
        description: Solution folder in the repository
        required: true
        default: solutions
      solution_version:
        description: Version to deploy, for example 1.0.0.1
        required: true

permissions:
  contents: read

jobs:
  deploy-to-production:
    runs-on: windows-latest
    environment: Pro customer service trial

    env:
      ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
      CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
      TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Validate production connection
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Pack managed solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: >-
            ${{ inputs.solution_folder }}/${{
            inputs.solution_name }}
          solution-file: >-
            out/${{ inputs.solution_name }}_managed.zip
          solution-type: Managed

      - name: Import managed solution into production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-file: >-
            out/${{ inputs.solution_name }}_managed.zip
          force-overwrite: false
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60

      - name: Store deployed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-${{ inputs.solution_version }}
          path: out/${{ inputs.solution_name }}_managed.zip
          retention-days: 30

name: Release action

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  release-solution:
    uses: ./.github/workflows/deploy-solution-to-production.yml
    with:
      solution_name: Githubactionstests
      solution_folder: solutions
      solution_version: ${{ github.event.release.tag_name }}
    secrets: inherit
